name: Mega PR Test & Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '20'
  ENABLE_A11Y: 'true'
  ENABLE_PLAYWRIGHT_VRT: 'true'
  CODECOV_ENABLED: 'true' # optional if CODECOV_TOKEN configured

jobs:
  plan:
    name: Plan & Filters
    runs-on: ubuntu-latest
    outputs:
      src_changed: ${{ steps.filter.outputs.src }}
      ui_changed: ${{ steps.filter.outputs.ui }}
      deps_changed: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'src/**'
            ui:
              - 'src/**'
              - 'stories/**'
              - '**/*.css'
            deps:
              - 'package.json'
              - 'package-lock.json'

  ci_setup:
    name: Setup Node (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

  ci_lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [ci_setup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: |
          if jq -e '.scripts.lint' package.json >/dev/null 2>&1; then
            npm run test:lint || true
          else
            echo "No lint script; skipping"
          fi

  ci_test_coverage:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    needs: [ci_setup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Test with coverage
        run: npx jest --coverage --coverageReporters='json-summary,text-summary'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
      - name: Upload to Codecov (optional)
        if: env.CODECOV_ENABLED == 'true' && secrets.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  ci_build_size:
    name: Build + Size + Time
    runs-on: ubuntu-latest
    needs: [ci_setup, plan]
    env:
      LANG: C.UTF-8
      CI_PROGRESS_UNICODE: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Spinner + progress
        run: bash scripts/ci/progress.sh "⠋ Building Project" 24 || true
      - name: Cold build (timed)
        id: build
        run: |
          START=$(date +%s%3N)
          npm run build
          END=$(date +%s%3N)
          echo "ms=$((END-START))" >> $GITHUB_OUTPUT
      - name: Size Limit (min+gzip)
        run: |
          mkdir -p .ci
          npx -y size-limit@10 --json > .ci/size-limit.json
      - name: Save metrics
        run: |
          jq -n --arg build_ms "${{ steps.build.outputs.ms }}" \
               --slurpfile sizes .ci/size-limit.json \
               '{build_ms: ($build_ms|tonumber), size_limit: $sizes[0]}' > .ci/metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: .ci/*.json

  ci_security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: [ci_setup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit --production --audit-level=moderate || true

  ci_a11y:
    name: Accessibility scan (pa11y)
    runs-on: ubuntu-latest
    needs: [ci_setup, plan]
    if: env.ENABLE_A11Y == 'true' && needs.plan.outputs.ui_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm i -g pa11y-ci@3 wait-on@7
      - name: Start preview server
        run: |
          nohup npm start >/dev/null 2>&1 &
          npx wait-on http://localhost:3000
      - name: Run pa11y-ci
        run: |
          printf '{ "urls": ["http://localhost:3000"] }\n' > pa11yci.json
          pa11y-ci || true
      - uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: pa11yci.json

  ci_vrt:
    name: Visual regression (Playwright)
    runs-on: ubuntu-latest
    needs: [ci_setup, plan]
    if: env.ENABLE_PLAYWRIGHT_VRT == 'true' && needs.plan.outputs.ui_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Run Playwright VRT
        run: |
          if [ -f "playwright.vrt.config.ts" ] && [ -d "tests/vrt" ]; then
            npx playwright test --config=playwright.vrt.config.ts || true
          else
            echo "Playwright VRT configuration or tests not found, skipping"
          fi

  ci_summarize:
    name: Sticky PR summary
    runs-on: ubuntu-latest
    needs: [ci_lint, ci_test_coverage, ci_build_size, ci_security]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: 
          name: coverage-summary
          path: .ci
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: 
          name: metrics
          path: .ci
        continue-on-error: true
      - name: Create default files if missing
        run: |
          mkdir -p .ci
          [ ! -f .ci/coverage-summary.json ] && echo '{"total":{"statements":{"pct":0}}}' > .ci/coverage-summary.json
          [ ! -f .ci/metrics.json ] && echo '{"build_ms":0,"size_limit":[{"size":0}]}' > .ci/metrics.json
      - name: Post/Update sticky comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p, def='0') => { try { return fs.readFileSync(p,'utf8'); } catch { return def; } };
            let covPct = 0;
            try {
              const cov = JSON.parse(read('.ci/coverage-summary.json','{}'));
              covPct = cov?.total?.statements?.pct ?? cov?.total?.lines?.pct ?? 0;
            } catch {}
            let buildMs = 0, sizeKb = 0;
            try {
              const m = JSON.parse(read('.ci/metrics.json','{}'));
              buildMs = m.build_ms ?? 0;
              const sizes = m.size_limit ?? [];
              if (Array.isArray(sizes) && sizes[0]?.size) sizeKb = Math.round(sizes[0].size);
            } catch {}
            const spinner = "⠋";
            const bar = (pct)=> {
              const filled = Math.max(0, Math.min(10, Math.round(pct/10)));
              return `[${'█'.repeat(filled)}${'░'.repeat(10-filled)}] ${pct.toFixed(0)}%`;
            };
            const body = `
            ### PR Quality Gate
            ${spinner} Coverage: ${bar(Number(covPct))}
            ${spinner} Build time: ${buildMs} ms
            ${spinner} Bundle size: ~${sizeKb} kB (min+gzip)
            _Leaderboard uses build time, bundle size, and coverage (no Lighthouse). See #275._
            <!-- ci-summary-sticky -->
            `;
            const {owner, repo, number} = context.issue;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number: number, per_page: 100});
            const existing = comments.data.find(c => c.body?.includes('<!-- ci-summary-sticky -->'));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: number, body});
            }

  ci_leaderboard_update:
    name: Update leaderboard (#275)
    runs-on: ubuntu-latest
    needs: [ci_summarize]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with: 
          name: metrics
          path: .ci
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: 
          name: coverage-summary
          path: .ci
        continue-on-error: true
      - name: Create default files if missing (leaderboard)
        run: |
          mkdir -p .ci
          [ ! -f .ci/coverage-summary.json ] && echo '{"total":{"statements":{"pct":0}}}' > .ci/coverage-summary.json
          [ ! -f .ci/metrics.json ] && echo '{"build_ms":0,"size_limit":[{"size":0}]}' > .ci/metrics.json
      - name: Update comment in #275
        uses: actions/github-script@v7
        with:
          script: |
            // Persist standings in a JSON code block inside a sticky comment on issue #275
            const fs = require('fs');
            const read = (p, def='0') => { try { return fs.readFileSync(p,'utf8'); } catch { return def; } };
            let buildMs = 0, sizeKb = 0, covPct = 0;
            try { const m = JSON.parse(read('.ci/metrics.json','{}'));
              buildMs = m.build_ms ?? 0;
              const arr = m.size_limit ?? [];
              if (Array.isArray(arr) && arr[0]?.size) sizeKb = Math.round(arr[0].size);
            } catch {}
            try { const cov = JSON.parse(read('.ci/coverage-summary.json','{}'));
              covPct = cov?.total?.statements?.pct ?? cov?.total?.lines?.pct ?? 0;
            } catch {}
            const author = context.payload.pull_request?.user?.login || context.actor;
            const prNumber = context.issue.number;

            // Score: lower build/time/size better; higher coverage better
            const score = Math.round((buildMs/500) + (sizeKb/10) - (covPct/2)); // tweak later

            const owner = context.repo.owner; const repo = context.repo.repo;
            const issue_number = 275;
            const marker = "<!-- ci-leaderboard -->";

            const comments = await github.rest.issues.listComments({owner, repo, issue_number, per_page: 100});
            let comment = comments.data.find(c => c.body?.includes(marker));
            let data = { updatedAt: new Date().toISOString(), entries: [] };
            if (comment) {
              const m = comment.body.match(/```json\n([\s\S]*?)\n```/);
              if (m) {
                try { data = JSON.parse(m[1]); } catch {}
              }
            }
            const existing = data.entries.find(e => e.author === author);
            const entry = { author, lastPR: prNumber, buildMs, sizeKb, covPct, score };
            if (existing) Object.assign(existing, entry); else data.entries.push(entry);
            // sort by score ascending (lower is better)
            data.entries.sort((a,b)=>a.score-b.score);

            const table = [
              '| Rank | Author | Score | Build (ms) | Size (kB) | Coverage (%) | Last PR |',
              '|-----:|--------|------:|-----------:|----------:|-------------:|--------:|',
              ...data.entries.map((e,i)=>`| ${i+1} | @${e.author} | ${e.score} | ${e.buildMs} | ${e.sizeKb} | ${Math.round(e.covPct)} | #${e.lastPR} |`)
            ].join('\n');

            const body = `### CI Leaderboard\n\n${table}\n\n\`\`\`json\n${JSON.stringify(data,null,2)}\n\`\`\`\n${marker}`;
            if (comment) {
              await github.rest.issues.updateComment({owner, repo, comment_id: comment.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }