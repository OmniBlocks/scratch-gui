name: Visual Regression Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Don't run if only docs/config changed
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.yml'
      - '.github/**'
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  # ============================================================
  # JOB 1: INITIALIZE (Create the Comment)
  # ============================================================
  init:
    if: >-
      (github.actor != 'dependabot[bot]') &&
      ((github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/vrt')))
    runs-on: ubuntu-latest
    outputs:
      comment_id: ${{ steps.create_comment.outputs.result }}
      pr_number: ${{ steps.pr_info.outputs.number }}
      base_sha: ${{ steps.pr_info.outputs.base_sha }}
      head_sha: ${{ steps.pr_info.outputs.head_sha }}
    steps:
      - name: Get PR Details
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.eventName === 'issue_comment'
              ? context.issue.number
              : context.payload.number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('number', pr.data.number);
            core.setOutput('base_sha', pr.data.base.sha);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('login', pr.data.user.login);

      - name: Create Initial Comment
        id: create_comment
        uses: actions/github-script@v7
        with:
          script: |
            const initial_spinner = '<img src="https://lh5.googleusercontent.com/proxy/OUqG0HgVNVMNorlPCmI4VgJa-3h7uHLkkMy9vdJ0eRsQlvJBytFUS-HvuW-O9EJd-c9xB7KAqlwby4Fzp59g1705FzBuP-F8dC1ZaBQtmLeCu5i6FfSd6Mmzh8mjOwgrEYZwy5UStg" width="20" height="20">';
            const body = `${initial_spinner} **Visual Regression Testing Started...**\n\n` +
              `> 🚀 Spinning up matrix tests across **Ubuntu, Windows, and macOS** using **Chromium, Firefox, and WebKit**.\n` +
              `> This will run significantly faster by using parallel jobs. I'll update this comment with the full gallery when finished.`;
            
            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr_info.outputs.number }},
              body: body
            });
            return comment.data.id;

  # ============================================================
  # JOB 2: MATRIX TESTING (Run all tests)
  # ============================================================
  vrt-matrix:
    needs: init
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]
        include:
          # Only run WebKit on macOS (safari-like behavior)
          - os: windows-latest
            browser: webkit
        exclude:
          # Exclude combinations that are redundant or problematic
          - os: windows-latest
            browser: webkit 
          - os: ubuntu-latest
            browser: webkit

    name: ${{ matrix.os }} / ${{ matrix.browser }}
    steps:
      - name: Checkout Base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.init.outputs.base_sha }}
          path: base

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.init.outputs.head_sha }}
          path: pr

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Browsers
        run: |
          cd base
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}

      # Cross-platform server manager script
      - name: Create Server Manager Script
        run: |
          cat > server-manager.js << 'EOF'
          const { spawn } = require('child_process');
          const http = require('http');

          const action = process.argv[2]; // 'start' or 'check'
          const port = process.argv[3];
          const path = process.argv[4];

          if (action === 'start') {
            const server = spawn('npx', ['http-server', path, '-p', port], { 
              stdio: 'ignore', 
              detached: true,
              shell: true 
            });
            server.unref();
            console.log('Server process spawned');
          } 
          
          if (action === 'check') {
            const req = http.get(`http://localhost:${port}`, (res) => {
              console.log('UP');
              process.exit(0);
            }).on('error', (e) => {
              process.exit(1);
            });
          }
          EOF

      # ----------------------------------------------------
      # BUILD & CAPTURE BASE
      # ----------------------------------------------------
      - name: Build Base
        run: |
          cd base
          npm run build
        env:
          NODE_ENV: production

      - name: Start Base Server
        run: |
          node server-manager.js start 8080 base/build
          # Wait loop in shell for portability
          sleep 5

      - name: Playwright Capture Base
        run: |
          # Dynamic config creation
          cat > playwright.config.js << 'EOF'
          const { defineConfig } = require('@playwright/test');
          module.exports = defineConfig({
            testDir: '.',
            timeout: 90000, // Increased for multiple tabs
            retries: 2,
            workers: 4, // Utilizing multiple cores
            use: {
              trace: 'on-first-retry',
              screenshot: 'only-on-failure',
              viewport: { width: 1366, height: 900 },
            },
            projects: [{ name: 'default', use: { browserName: '${{ matrix.browser }}' } }]
          });
          EOF

          # RESTORED FULL TEST SPEC
          cat > test.spec.js << 'EOF'
          const { test, expect } = require('@playwright/test');

          const PORT = process.env.PORT || '8080';
          const BASE = `http://localhost:${PORT}`;

          async function waitEditor(page) {
            await page.goto(`${BASE}/editor.html`);
            await page.waitForLoadState('networkidle');
            // Wait for menu bar as a proxy for "app loaded"
            await page.waitForSelector('[class*="menu-bar"]', { timeout: 30000 });
            // Small buffer for canvas rendering
            await page.waitForTimeout(1500);
          }

          async function clickTabByIndex(page, index) {
            const tabList = page.locator('[role="tablist"]').first();
            await expect(tabList).toBeVisible({ timeout: 15000 });
            const tab = tabList.locator('[role="tab"]').nth(index);
            await expect(tab).toBeVisible({ timeout: 5000 });
            await tab.scrollIntoViewIfNeeded();
            await tab.click();
            await page.waitForTimeout(1000); // Wait for tab switch animation
          }

          test.describe('Visual Regression Screenshots', () => {
            test('Editor - Initial Load', async ({ page }) => {
              await waitEditor(page);
              await page.screenshot({ path: 'screenshots/editor-initial.png', fullPage: true });
            });

            test('Editor - Blocks Workspace', async ({ page }) => {
              await waitEditor(page);
              const editorWrapper = page.locator('[class*="editor-wrapper"]').first();
              if (await editorWrapper.count()) {
                await editorWrapper.screenshot({ path: 'screenshots/blocks-workspace.png' });
              } else {
                await page.screenshot({ path: 'screenshots/blocks-workspace.png' });
              }
            });

            test('Editor - Stage and Sprites', async ({ page }) => {
              await waitEditor(page);
              const stageWrapper = page.locator('[class*="stage-and-target-wrapper"]').first();
              if (await stageWrapper.count()) {
                await stageWrapper.screenshot({ path: 'screenshots/stage-sprites.png' });
              } else {
                await page.screenshot({ path: 'screenshots/stage-sprites.png', clip: { x: 0, y: 0, width: 600, height: 800 } });
              }
            });

            test('Editor - Code Tab', async ({ page }) => {
              await waitEditor(page);
              await clickTabByIndex(page, 0);
              await page.screenshot({ path: 'screenshots/code-tab.png', fullPage: true });
            });

            test('Editor - Costumes Tab', async ({ page }) => {
              await waitEditor(page);
              await clickTabByIndex(page, 1);
              await page.screenshot({ path: 'screenshots/costumes-tab.png', fullPage: true });
            });

            test('Editor - Sounds Tab', async ({ page }) => {
              await waitEditor(page);
              await clickTabByIndex(page, 2);
              await page.screenshot({ path: 'screenshots/sounds-tab.png', fullPage: true });
            });

            test('Editor - Songs Tab', async ({ page }) => {
              await waitEditor(page);
              await clickTabByIndex(page, 3);
              await page.screenshot({ path: 'screenshots/songs-tab.png', fullPage: true });
            });

            test('Player View', async ({ page }) => {
              await page.goto(`${BASE}/`);
              await page.waitForLoadState('networkidle');
              await page.waitForTimeout(1000);
              await page.screenshot({ path: 'screenshots/player-view.png', fullPage: true });
            });
          });
          EOF
          
          mkdir -p screenshots
          # Run on PORT 8080
          PORT=8080 npx playwright test test.spec.js
          
          # Rename output folder
          mv screenshots screenshots-base

      # ----------------------------------------------------
      # BUILD & CAPTURE PR
      # ----------------------------------------------------
      - name: Build PR
        run: |
          cd pr
          npm ci
          npm run build
        env:
          NODE_ENV: production

      - name: Start PR Server
        run: |
          node server-manager.js start 8081 pr/build
          sleep 5

      - name: Playwright Capture PR
        run: |
          # Use the same spec, just different port
          mkdir -p screenshots
          PORT=8081 npx playwright test test.spec.js
          
          # Rename output folder
          mv screenshots screenshots-pr

      # ----------------------------------------------------
      # COMPARE WITH GIFS
      # ----------------------------------------------------
      - name: Compare & Generate Diff
        run: |
          # Install comparison deps
          npm install pngjs pixelmatch gifenc
          
          cat > compare.js << 'EOF'
          const fs = require('fs');
          const { PNG } = require('pngjs');
          
          // ESM/CJS interop for pixelmatch & gifenc
          const pmMod = require('pixelmatch');
          const pixelmatch = pmMod && (pmMod.default || pmMod);
          
          const geMod = require('gifenc');
          const GIFEncoder = (geMod && (geMod.GIFEncoder || geMod.default?.GIFEncoder)) || null;
          const quantize   = (geMod && (geMod.quantize   || geMod.default?.quantize))   || null;
          const applyPalette = (geMod && (geMod.applyPalette || geMod.default?.applyPalette)) || null;
          
          const files = fs.readdirSync('screenshots-base');
          const results = [];
          let hasDiff = false;

          if (!fs.existsSync('diffs')) fs.mkdirSync('diffs');
          if (!fs.existsSync('gifs')) fs.mkdirSync('gifs');

          files.forEach(file => {
            if (!fs.existsSync(`screenshots-pr/${file}`)) return;
            
            const img1 = PNG.sync.read(fs.readFileSync(`screenshots-base/${file}`));
            const img2 = PNG.sync.read(fs.readFileSync(`screenshots-pr/${file}`));
            const { width, height } = img1;
            const diff = new PNG({ width, height });

            const numDiffPixels = pixelmatch(img1.data, img2.data, diff.data, width, height, { threshold: 0.1 });
            
            let gifGenerated = false;
            
            if (numDiffPixels > 0) {
              fs.writeFileSync(`diffs/${file}`, PNG.sync.write(diff));
              hasDiff = true;
              
              // Generate GIF: Base -> PR -> Diff
              if (GIFEncoder && quantize && applyPalette) {
                try {
                  const enc = GIFEncoder();
                  const frames = [img1, img2, diff];
                  const format = 'rgba444';
                  for (const frame of frames) {
                    const palette = quantize(frame.data, 256, { format });
                    const index = applyPalette(frame.data, palette, format);
                    enc.writeFrame(index, frame.width, frame.height, { palette, delay: 900 });
                  }
                  enc.finish();
                  fs.writeFileSync(`gifs/${file.replace('.png', '.gif')}`, Buffer.from(enc.bytes()));
                  gifGenerated = true;
                } catch (e) {
                  console.error('GIF Gen Error:', e);
                }
              }
            }

            results.push({ 
              file, 
              diffPixels: numDiffPixels, 
              hasDiff: numDiffPixels > 0,
              gif: gifGenerated ? file.replace('.png', '.gif') : null
            });
          });

          fs.writeFileSync('result.json', JSON.stringify({ hasDiff, results }));
          EOF

          node compare.js

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vrt-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            screenshots-base/
            screenshots-pr/
            diffs/
            gifs/
            result.json
          retention-days: 1

  # ============================================================
  # JOB 3: REPORT (Aggregation & Commenting)
  # ============================================================
  report:
    needs: [init, vrt-matrix]
    if: always() # Run even if some matrix jobs failed
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Checkout Image Storage Branch
        uses: actions/checkout@v4
        with:
          ref: vrt-images
          path: vrt-images-repo
        continue-on-error: true # Might not exist yet

      - name: Prepare Image Storage
        run: |
          if [ ! -d "vrt-images-repo" ]; then
            git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git vrt-images-repo
            cd vrt-images-repo
            git checkout --orphan vrt-images || git checkout -b vrt-images
            git rm -rf . || true
          fi
          
          # Create unique folder for this run
          RUN_FOLDER="pr-${{ needs.init.outputs.pr_number }}/run-${{ github.run_id }}"
          mkdir -p "vrt-images-repo/$RUN_FOLDER"
          
          # Move artifacts into repo structure
          cp -R all-results/* "vrt-images-repo/$RUN_FOLDER/"

      - name: Push Images
        id: push_images
        run: |
          cd vrt-images-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "VRT Assets PR-${{ needs.init.outputs.pr_number }}"
          git push origin vrt-images
          
          # Output base URL
          echo "url_base=https://raw.githubusercontent.com/${{ github.repository }}/vrt-images/pr-${{ needs.init.outputs.pr_number }}/run-${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Generate & Update Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const root = 'all-results';
            const urlBase = '${{ steps.push_images.outputs.url_base }}';
            const dirs = fs.readdirSync(root).filter(f => f.startsWith('vrt-'));
            
            const display = n => n.replace('.png','').replace(/-/g,' ').replace(/\b\w/g, l => l.toUpperCase());
            
            let summary = `## 🎨 Visual Regression Results\n`;
            let changesBody = "";
            let fullReportBody = "";
            let changesCount = 0;

            for (const dir of dirs) {
              const [_, os, browser] = dir.split('-'); // simple parse assuming vrt-os-browser
              // Fix matrix naming split if os contains hyphens (ubuntu-latest)
              const osName = dir.replace('vrt-', '').replace(`-${browser}`, ''); 
              
              const resultPath = path.join(root, dir, 'result.json');
              if (!fs.existsSync(resultPath)) continue;

              const data = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
              
              // Header for this matrix combo
              const title = `**${osName}** (${browser})`;
              let sectionContent = "";
              
              data.results.forEach(r => {
                const baseImg = `${urlBase}/${dir}/screenshots-base/${r.file}`;
                const prImg = `${urlBase}/${dir}/screenshots-pr/${r.file}`;
                const diffImg = `${urlBase}/${dir}/diffs/${r.file}`;
                const gifImg  = r.gif ? `${urlBase}/${dir}/gifs/${r.gif}` : null;
                const name = display(r.file);

                const tableRow = `
                <table>
                  <thead><tr><th align="left">Base</th><th align="left">PR</th></tr></thead>
                  <tbody>
                    <tr>
                      <td><img src="${baseImg}" width="300"/></td>
                      <td><img src="${prImg}" width="300"/></td>
                    </tr>
                    ${r.hasDiff ? `
                    <tr>
                      <td colspan="2"><strong>Diff & Animation:</strong><br>
                      <img src="${diffImg}" width="600"/><br>
                      ${gifImg ? `<img src="${gifImg}" width="600"/>` : ''}
                      </td>
                    </tr>` : ''}
                  </tbody>
                </table><br>`;
                
                if (r.hasDiff) {
                  changesCount++;
                  changesBody += `\n### ${osName} / ${browser} / ${name}\n` + tableRow;
                  sectionContent += `❌ ${r.file} (Diff detected)\n`;
                } else {
                  sectionContent += `✅ ${r.file}\n`;
                }
                
                // Add to full report regardless of status
                fullReportBody += `<h4>${title} - ${name}</h4>` + tableRow;
              });

              // Wrap full report section in details
              fullReportBody = `<details><summary>${data.hasDiff ? '🔴' : '🟢'} ${title}</summary>\n\n` + fullReportBody + `\n</details>\n`;
            }

            if (changesCount > 0) {
               summary += `### ⚠️ ${changesCount} Visual Differences Detected\n`;
               summary += `These views have changed visually. Please review them below:\n\n`;
               summary += changesBody;
               summary += `\n---\n`;
            } else {
               summary += `### ✅ No Visual Differences Detected\n`;
               summary += `All views match the baselines across all platforms and browsers.\n\n`;
            }

            // Add the collapsible full report
            summary += `### 🔬 Detailed Breakdown\n`;
            summary += `See results for all platforms and browsers:\n\n`;
            summary += fullReportBody;

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ needs.init.outputs.comment_id }},
              body: summary
            });
