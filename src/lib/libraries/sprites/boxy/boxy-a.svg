  <g>
    <!-- Main body (box shape) -->
    <rect x="8" y="20" width="80" height="60" rx="8" ry="8" fill="url(#boxGradient)" stroke="#0277BD" stroke-width="2"/>
    
    <!-- Face -->
    <!-- Eyes -->
