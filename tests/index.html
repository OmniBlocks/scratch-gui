<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Results - OmniBlocks 🌪️</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px;
      text-align: center;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }
    
    .button {
      display: inline-block;
      padding: 15px 40px;
      margin: 10px;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.1em;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    
    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    
    .note {
      margin-top: 30px;
      opacity: 0.8;
    }
    
    .chaos {
      font-size: 2em;
      margin: 20px 0;
    }
    
    .browsers {
      font-size: 1.2em;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 OmniBlocks</h1>
    <h2>Main Branch Test Results</h2>
    <div class="chaos">🌪️ ULTRA CHAOS TESTING! 🌪️</div>
    <div class="browsers">🌐 Multi-Browser Testing: Chromium • Firefox • WebKit</div>
    <p>Comprehensive chaos testing across Windows, Ubuntu, and macOS with multiple browsers!</p>
    <a href="latest/index.html" class="button">📊 View Latest Dashboard</a>
    <p class="note">Now featuring Firefox 🦊 and WebKit 🧭 alongside Chromium! 🎉</p>
  </div>
</body>
</html>
